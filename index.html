<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning Briefing">
<title>Morning Briefing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100vh; background: #0a0a0f; font-family: Georgia, serif; color: #e8e0d0; overflow-x: hidden; }
  .bg { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(249,115,22,.09) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 80%, rgba(59,130,246,.07) 0%, transparent 60%); }
  .wrap { position: relative; max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
  .badge { display: inline-block; background: linear-gradient(135deg,#f97316,#fb923c); border-radius: 4px; padding: 4px 12px; font-size: 11px; font-family: monospace; letter-spacing: 3px; color: #fff; font-weight: 700; }
  h1 { font-size: clamp(24px,6vw,40px); font-weight: 400; background: linear-gradient(135deg,#f5f0e8 30%,#a89880); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .api-card { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .api-card label { display: block; font-family: monospace; font-size: 11px; color: #f97316; letter-spacing: 2px; margin-bottom: 10px; }
  .api-card input { width: 100%; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 10px 14px; color: #c4b8a8; font-size: 13px; font-family: monospace; outline: none; }
  .api-card input:focus { border-color: rgba(249,115,22,.4); }
  .save-btn { margin-top: 10px; width: 100%; background: linear-gradient(135deg,#f97316,#ea580c); border: none; border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .seg-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .seg-btn { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: 14px 16px; text-align: left; width: 100%; transition: all .25s; }
  .seg-btn.active { background: rgba(255,255,255,.07); }
  .seg-icon { font-size: 22px; flex-shrink: 0; }
  .seg-label { font-size: 14px; font-weight: 600; font-family: monospace; color: #c4b8a8; }
  .seg-label.active { color: var(--seg-color); }
  .seg-label.done { color: #4a4035; }
  .seg-ready { font-size: 11px; font-family: monospace; color: #3a342a; margin-top: 2px; }
  .seg-ready.loaded { color: #10b981; }
  .wave { display: flex; gap: 3px; margin-top: 5px; align-items: flex-end; }
  .wave-bar { width: 3px; height: 14px; border-radius: 2px; opacity: .8; background: var(--seg-color); animation: wave .8s ease-in-out infinite alternate; }
  .progress-wrap { margin-bottom: 24px; }
  .progress-track { height: 5px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#f97316,#fb923c); border-radius: 3px; transition: width 1s linear; }
  .progress-times { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; font-family: monospace; color: #4a4035; }
  .controls { display: flex; gap: 14px; justify-content: center; margin-bottom: 20px; }
  .btn-play { background: linear-gradient(135deg,#f97316,#ea580c); color: #fff; border: none; border-radius: 50%; width: 88px; height: 88px; font-size: 32px; cursor: pointer; box-shadow: 0 0 50px rgba(249,115,22,.5); display: flex; align-items: center; justify-content: center; }
  .btn-play:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn-pause { background: rgba(249,115,22,.15); color: #f97316; border: 1px solid rgba(249,115,22,.3); border-radius: 50%; width: 64px; height: 64px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-stop { background: rgba(255,255,255,.05); color: #6b6355; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; width: 64px; height: 64px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-spotify { width: 100%; background: linear-gradient(135deg,#1db954,#1aa34a); color: #fff; border: none; border-radius: 14px; padding: 18px; font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: 0 0 30px rgba(29,185,84,.3); margin-bottom: 12px; }
  .btn-replay { background: rgba(249,115,22,.1); color: #f97316; border: 1px solid rgba(249,115,22,.2); border-radius: 10px; padding: 12px 28px; font-size: 15px; cursor: pointer; }
  .status-bar { background: rgba(249,115,22,.07); border: 1px solid rgba(249,115,22,.15); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-family: monospace; font-size: 13px; color: #fb923c; text-align: center; }
  .status-bar.error { background: rgba(239,68,68,.07); border-color: rgba(239,68,68,.2); color: #ef4444; }
  .reset-key { background: none; border: none; color: #3a342a; font-size: 11px; font-family: monospace; cursor: pointer; text-decoration: underline; display: block; text-align: center; margin-top: 12px; }
  .center { text-align: center; }
  .mono { font-family: monospace; }
  .muted { color: #6b6355; }
  @keyframes wave { from { transform: scaleY(.4); } to { transform: scaleY(1.3); } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="center" style="margin-bottom:32px">
    <div class="badge" style="margin-bottom:12px">MORNING BRIEFING</div>
    <h1 style="margin-bottom:6px">Your Daily Intelligence Podcast</h1>
    <p class="mono muted" id="dateDisplay" style="font-size:13px"></p>
  </div>

  <!-- API key setup — hidden once saved -->
  <div class="api-card" id="apiCard">
    <label>OPENAI API KEY</label>
    <input type="password" id="apiKeyInput" placeholder="Paste your OpenAI API key..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="save-btn" onclick="saveKey()">Save & Start</button>
    <p class="mono muted" style="font-size:11px;margin-top:8px;text-align:center">Saved to your device only — never in the code</p>
  </div>

  <div class="status-bar" id="statusBar" style="display:none"></div>
  <div class="seg-list" id="segList"></div>

  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-times"><span id="timeElapsed">0:00</span><span>15:00</span></div>
  </div>

  <div id="readyControls" class="center" style="display:none;margin-bottom:20px">
    <button class="btn-play" id="playBtn" onclick="startBriefing()">▶</button>
    <p class="mono muted" id="playHint" style="font-size:13px;margin-top:12px">Tap to begin · ~15 minutes</p>
    <button class="reset-key" onclick="resetKey()">Change API key</button>
  </div>

  <div class="controls" id="playingControls" style="display:none">
    <button class="btn-pause" id="pauseBtn" onclick="togglePause()">⏸</button>
    <button class="btn-stop" onclick="stopBriefing()">⏹</button>
  </div>

  <div id="doneControls" class="center" style="display:none">
    <p class="mono" style="color:#10b981;margin-bottom:18px;font-size:14px">✓ Briefing Complete</p>
    <button class="btn-spotify" onclick="openSpotify()">🎵 Open Spotify</button><br>
    <button class="btn-replay" onclick="resetAndStart()">↺ Play Again</button>
  </div>
</div>

<script>
const BRIEFING_DATE = "Monday, May 25, 2026";
const VOICE = "alloy";

document.getElementById("dateDisplay").textContent = BRIEFING_DATE;

const SEGMENTS = [
  {
    key: "headlines", label: "Headlines & LA", icon: "📰", color: "#f97316",
    text: "Good morning and happy Memorial Day. Today is Monday, May 25th, 2026, and America is pausing to honor its fallen service members on the nation's 250th anniversary year. President Trump spoke this morning at the 158th National Memorial Day Observance at Arlington National Cemetery, presiding over a ceremony that carried extra weight given both the anniversary milestone and the ongoing U.S.-Iran conflict that has put American military readiness back at the forefront of the national conversation. On the political front, the White House is facing renewed scrutiny over President Trump's health. The administration put out a statement boasting of his excellent health, but questions are circulating given that he is the oldest inaugurated president in U.S. history. Meanwhile a man was shot and killed near a White House security checkpoint on Saturday after opening fire, marking the third incident of gunfire in the vicinity of the president in the past month alone. Closer to home, the city of Los Angeles is about one week out from its June 2nd municipal elections. Eight of fifteen City Council seats are on the ballot, along with three school board seats. Mayor Karen Bass is running for reelection, as is City Attorney Hydee Feldstein Soto. Spencer Pratt is running for City Council, holding block parties in South LA complete with taco trucks, influencer livestreams, and campaign merch — drawing crowds and attention in a race that could reshape the balance of power on the Council ahead of the 2028 Olympics."
  },
  {
    key: "realestate", label: "Real Estate", icon: "🏙️", color: "#3b82f6",
    text: "Let's talk real estate, because the macro setup right now is genuinely interesting for anyone watching the Los Angeles market. The California Association of Realtors is forecasting a statewide median home price of 905 thousand dollars in 2026, a 3.6 percent increase from last year. The 30-year fixed mortgage rate in California sits at 6.54 percent as of this month, and affordability is at just 18 percent statewide — meaning only 18 out of every 100 California households can afford a median-priced home. That is a stunning number and it explains why transaction volume remains so subdued even as prices hold firm. The Los Angeles market is defined right now by stability, selectivity, and strategy. Brentwood and Beverly Hills are seeing modest appreciation in the 1 to 3 percent range. Downtown LA condos continue to struggle as remote work reshaped demand patterns. The Eastside and Koreatown are seeing some price softness as affordability pushes buyers further out. Here is the big picture takeaway: if the Strait of Hormuz deal holds and oil prices fall, the Fed gets cover to cut rates in September. Even a half-point drop in mortgage rates would unleash an enormous wave of pent-up buyer demand in Los Angeles. Investors with a long-term view might look at the current moment as a quiet entry window before that next wave arrives."
  },
  {
    key: "startups", label: "Startups", icon: "🚀", color: "#10b981",
    text: "Now let's get into the startup world, because the past week saw some enormous capital moves. The theme running through all of it is what investors are calling the agentic infrastructure super-cycle — the AI buildout has moved past foundation models and is now focused on the plumbing needed to make AI work at industrial scale. Global venture investment surged to 300 billion dollars in the first quarter of 2026 alone, representing nearly 70 percent of all capital deployed in all of 2025. Exa, an AI-powered search infrastructure company, raised 250 million dollars in a Series C led by Andreessen Horowitz. Modal, a cloud computing platform for AI workloads, raised 355 million dollars in a Series C led by General Catalyst. Mercury, the financial operating system built for startups, raised 200 million dollars in a Series D at a 5.2 billion dollar valuation — essentially becoming the bank of the startup economy. And Parallel Web Systems, founded by former Twitter CEO Parag Agrawal, raised 100 million dollars led by Sequoia for its AI agent search platform. The pattern is clear: the companies building infrastructure underneath AI are where institutional capital is concentrating right now."
  },
  {
    key: "markets", label: "Markets", icon: "📊", color: "#8b5cf6",
    text: "Markets are closed today for Memorial Day. The S&P 500 closed Friday at 7,473, locking in its eighth consecutive weekly gain — the longest winning streak since late 2023. The Dow sits at its all-time record close of 50,579. The Nasdaq finished at 26,343. The setup heading into Tuesday's open is significant. S&P 500 futures jumped to a record high after the U.S. announced a deal to reopen the Strait of Hormuz — the single biggest catalyst the market has been waiting for all year. If sustained, it removes a major inflationary pressure and could open the door for the Fed to cut rates as early as September. Goldman Sachs has warned of a growing risk that rising yields could trigger a correction, and consumer sentiment just fell to a new low in the University of Michigan's May survey. The week ahead is packed: Tuesday brings consumer confidence data and earnings from AutoZone and Zscaler. Wednesday brings new home sales alongside results from Salesforce, Marvell, and Snowflake. Dell reports May 28th and HP reports May 27th. Watch oil prices tonight when futures open — they will set the tone for Tuesday's open."
  },
  {
    key: "sports", label: "Sports", icon: "🏀", color: "#f59e0b",
    text: "Let's close with sports. The NBA Conference Finals are delivering must-watch basketball. The New York Knicks are rolling through the Cleveland Cavaliers in the Eastern Conference Finals. The Knicks won Game 1, 115 to 104 in overtime. They won Game 2, 109 to 93. They won Game 3, 121 to 108. Game 4 is tonight in Cleveland at 8 p.m. Eastern on ESPN, and the Cavaliers are facing elimination at home on Memorial Day night. In the Western Conference, the Oklahoma City Thunder and the San Antonio Spurs are tied at two games apiece, with Game 5 tomorrow night. The NBA Finals begin June 3rd and right now the Knicks look like the team to beat. Enjoy the holiday, stay safe out there, and we will be back tomorrow morning. This has been your Morning Briefing for Monday, May 25th, 2026. Have a great Memorial Day."
  }
];

let apiKey = localStorage.getItem("openai_api_key") || "";
let audioBlobs = new Array(SEGMENTS.length).fill(null);
let audioEl = null;
let currentIdx = 0;
let isPaused = false;
let isLoading = false;
let progressInterval = null;
let startTime = null;
let elapsedPaused = 0;
const TARGET_S = 15 * 60;

window.onload = () => {
  renderSegments();
  if (apiKey) {
    document.getElementById("apiCard").style.display = "none";
    document.getElementById("readyControls").style.display = "block";
  }
};

function saveKey() {
  const val = document.getElementById("apiKeyInput").value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem("openai_api_key", val);
  document.getElementById("apiCard").style.display = "none";
  document.getElementById("readyControls").style.display = "block";
}

function resetKey() {
  localStorage.removeItem("openai_api_key");
  apiKey = "";
  document.getElementById("readyControls").style.display = "none";
  document.getElementById("apiCard").style.display = "block";
  document.getElementById("apiKeyInput").value = "";
}

function renderSegments() {
  const list = document.getElementById("segList");
  list.innerHTML = SEGMENTS.map((s, i) => `
    <div class="seg-btn" id="seg_${i}" style="--seg-color:${s.color}">
      <span class="seg-icon">${s.icon}</span>
      <div style="flex:1">
        <div class="seg-label" id="seglabel_${i}">${s.label}</div>
        <div id="segwave_${i}" style="display:none">
          <div class="wave">${[0,1,2,3,4].map(j=>`<div class="wave-bar" style="background:${s.color};animation-delay:${j*.1}s"></div>`).join("")}</div>
        </div>
        <div class="seg-ready" id="segready_${i}">pending...</div>
      </div>
      <span id="segcheck_${i}" style="display:none;color:#10b981;font-size:18px">✓</span>
      <span id="segplaying_${i}" style="display:none;color:${s.color};font-size:11px;font-family:monospace">PLAYING</span>
    </div>
  `).join("");
}

function setSegState(idx, state) {
  const btn   = document.getElementById(`seg_${idx}`);
  const label = document.getElementById(`seglabel_${idx}`);
  const wave  = document.getElementById(`segwave_${idx}`);
  const check = document.getElementById(`segcheck_${idx}`);
  const play  = document.getElementById(`segplaying_${idx}`);
  const ready = document.getElementById(`segready_${idx}`);
  btn.classList.toggle("active", state === "active");
  label.className = "seg-label" + (state === "active" ? " active" : state === "done" ? " done" : "");
  wave.style.display  = state === "active" ? "block" : "none";
  check.style.display = state === "done"   ? "inline" : "none";
  play.style.display  = state === "active" ? "inline" : "none";
  ready.style.display = (state === "active" || state === "done") ? "none" : "block";
  ready.className = "seg-ready" + (state === "ready" ? " loaded" : "");
  ready.textContent = state === "loading" ? "generating..." : state === "ready" ? "✓ ready" : "pending...";
}

async function fetchSegmentAudio(idx) {
  setSegState(idx, "loading");
  const res = await fetch("https://api.openai.com/v1/audio/speech", {
    method: "POST",
    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
    body: JSON.stringify({ model: "tts-1", input: SEGMENTS[idx].text, voice: VOICE, speed: 0.95 })
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`OpenAI error ${res.status}: ${err.slice(0,200)}`);
  }
  const blob = await res.blob();
  audioBlobs[idx] = URL.createObjectURL(blob);
  setSegState(idx, "ready");
}

async function startBriefing() {
  if (isLoading) return;
  isLoading = true;
  currentIdx = 0; elapsedPaused = 0; isPaused = false;
  document.getElementById("playBtn").disabled = true;
  document.getElementById("playHint").textContent = "Generating audio — please wait...";
  SEGMENTS.forEach((_, i) => setSegState(i, "pending"));
  showStatus("Generating all segments with Alloy voice — about 20 seconds...", false);
  try {
    await Promise.all(SEGMENTS.map((_, i) => fetchSegmentAudio(i)));
    hideStatus();
    isLoading = false;
    document.getElementById("readyControls").style.display = "none";
    document.getElementById("playingControls").style.display = "flex";
    document.getElementById("progressWrap").style.display = "block";
    startTime = Date.now();
    startProgressTimer();
    playSegment(0);
  } catch(e) {
    isLoading = false;
    document.getElementById("playBtn").disabled = false;
    document.getElementById("playHint").textContent = "Tap to begin · ~15 minutes";
    showStatus(`Error: ${e.message}`, true);
    SEGMENTS.forEach((_, i) => setSegState(i, "pending"));
  }
}

function playSegment(idx) {
  if (idx >= SEGMENTS.length) {
    clearInterval(progressInterval);
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("timeElapsed").textContent = "15:00";
    document.getElementById("playingControls").style.display = "none";
    document.getElementById("doneControls").style.display = "block";
    SEGMENTS.forEach((_, i) => setSegState(i, "done"));
    return;
  }
  currentIdx = idx;
  if (idx > 0) setSegState(idx - 1, "done");
  setSegState(idx, "active");
  audioEl = new Audio(audioBlobs[idx]);
  audioEl.onended = () => playSegment(idx + 1);
  audioEl.onerror = () => playSegment(idx + 1);
  audioEl.play().catch(() => playSegment(idx + 1));
}

function togglePause() {
  if (!audioEl) return;
  if (isPaused) {
    audioEl.play(); isPaused = false;
    document.getElementById("pauseBtn").textContent = "⏸";
    startProgressTimer();
  } else {
    audioEl.pause(); isPaused = true;
    elapsedPaused += (Date.now() - startTime) / 1000;
    clearInterval(progressInterval);
    document.getElementById("pauseBtn").textContent = "▶";
  }
}

function stopBriefing() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  clearInterval(progressInterval);
  isPaused = false; isLoading = false; elapsedPaused = 0;
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("timeElapsed").textContent = "0:00";
  document.getElementById("playingControls").style.display = "none";
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("readyControls").style.display = "block";
  document.getElementById("playBtn").disabled = false;
  document.getElementById("playHint").textContent = "Tap to begin · ~15 minutes";
  SEGMENTS.forEach((_, i) => setSegState(i, audioBlobs[i] ? "ready" : "pending"));
}

function resetAndStart() {
  document.getElementById("doneControls").style.display = "none";
  document.getElementById("playingControls").style.display = "flex";
  document.getElementById("progressWrap").style.display = "block";
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("timeElapsed").textContent = "0:00";
  currentIdx = 0; elapsedPaused = 0; isPaused = false;
  startTime = Date.now();
  startProgressTimer();
  playSegment(0);
}

function startProgressTimer() {
  clearInterval(progressInterval);
  startTime = Date.now();
  progressInterval = setInterval(() => {
    const total = elapsedPaused + (Date.now() - startTime) / 1000;
    const pct = Math.min(total / TARGET_S * 100, 99);
    document.getElementById("progressFill").style.width = pct + "%";
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    document.getElementById("timeElapsed").textContent = `${m}:${String(s).padStart(2,"0")}`;
  }, 1000);
}

function showStatus(msg, isError) {
  const el = document.getElementById("statusBar");
  el.textContent = msg;
  el.className = "status-bar" + (isError ? " error" : "");
  el.style.display = "block";
}
function hideStatus() { document.getElementById("statusBar").style.display = "none"; }
function openSpotify() { window.location.href = "https://open.spotify.com"; }
</script>
</body>
</html>
