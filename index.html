<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning Briefing">
<title>Morning Briefing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100vh; background: #0a0a0f; font-family: Georgia, serif; color: #e8e0d0; overflow-x: hidden; }
  .bg { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(249,115,22,.09) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 80%, rgba(59,130,246,.07) 0%, transparent 60%); }
  .wrap { position: relative; max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  .badge { display: inline-block; background: linear-gradient(135deg,#f97316,#fb923c); border-radius: 4px; padding: 4px 12px; font-size: 11px; font-family: monospace; letter-spacing: 3px; color: #fff; font-weight: 700; }
  h1 { font-size: clamp(22px,5vw,36px); font-weight: 400; background: linear-gradient(135deg,#f5f0e8 30%,#a89880); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  /* Setup screen */
  .setup-card { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .setup-card label { display: block; font-family: monospace; font-size: 11px; color: #f97316; letter-spacing: 2px; margin-bottom: 8px; }
  .setup-card input { width: 100%; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 10px 14px; color: #c4b8a8; font-size: 13px; font-family: monospace; outline: none; margin-bottom: 8px; }
  .setup-card input:focus { border-color: rgba(249,115,22,.4); }
  .save-btn { width: 100%; background: linear-gradient(135deg,#f97316,#ea580c); border: none; border-radius: 8px; padding: 14px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }

  /* Segments */
  .seg-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .seg-btn { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: 14px 16px; text-align: left; width: 100%; transition: all .25s; }
  .seg-btn.active { background: rgba(255,255,255,.07); }
  .seg-icon { font-size: 22px; flex-shrink: 0; }
  .seg-label { font-size: 14px; font-weight: 600; font-family: monospace; color: #c4b8a8; }
  .seg-label.active { color: var(--seg-color); }
  .seg-label.done { color: #4a4035; }
  .seg-sub { font-size: 11px; font-family: monospace; color: #3a342a; margin-top: 2px; }
  .seg-sub.ready { color: #10b981; }
  .wave { display: flex; gap: 3px; margin-top: 5px; align-items: flex-end; }
  .wave-bar { width: 3px; height: 14px; border-radius: 2px; opacity: .8; background: var(--seg-color); animation: wave .8s ease-in-out infinite alternate; }

  /* Progress */
  .progress-wrap { margin-bottom: 24px; }
  .progress-track { height: 5px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#f97316,#fb923c); border-radius: 3px; transition: width 1s linear; }
  .progress-times { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; font-family: monospace; color: #4a4035; }

  /* Buttons */
  .btn-play { background: linear-gradient(135deg,#f97316,#ea580c); color: #fff; border: none; border-radius: 50%; width: 88px; height: 88px; font-size: 32px; cursor: pointer; box-shadow: 0 0 50px rgba(249,115,22,.5); display: flex; align-items: center; justify-content: center; }
  .btn-play:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn-pause { background: rgba(249,115,22,.15); color: #f97316; border: 1px solid rgba(249,115,22,.3); border-radius: 50%; width: 64px; height: 64px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-stop { background: rgba(255,255,255,.05); color: #6b6355; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; width: 64px; height: 64px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-spotify { width: 100%; background: linear-gradient(135deg,#1db954,#1aa34a); color: #fff; border: none; border-radius: 14px; padding: 18px; font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: 0 0 30px rgba(29,185,84,.3); margin-bottom: 12px; }
  .btn-replay { background: rgba(249,115,22,.1); color: #f97316; border: 1px solid rgba(249,115,22,.2); border-radius: 10px; padding: 12px 28px; font-size: 15px; cursor: pointer; }
  .btn-settings { background: none; border: none; color: #3a342a; font-size: 11px; font-family: monospace; cursor: pointer; text-decoration: underline; display: block; text-align: center; margin-top: 12px; }

  /* Status */
  .status-bar { border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-family: monospace; font-size: 13px; text-align: center; }
  .status-bar.info { background: rgba(249,115,22,.07); border: 1px solid rgba(249,115,22,.15); color: #fb923c; }
  .status-bar.error { background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.2); color: #ef4444; }

  /* Loading spinner */
  .spinner-wrap { text-align: center; padding: 20px 0; }
  .spinner { width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(249,115,22,.2); border-top-color: #f97316; animation: spin 1s linear infinite; margin: 0 auto 16px; }

  .center { text-align: center; }
  .controls { display: flex; gap: 14px; justify-content: center; margin-bottom: 20px; }
  .mono { font-family: monospace; }
  .muted { color: #6b6355; }

  @keyframes wave { from { transform: scaleY(.4); } to { transform: scaleY(1.3); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

  <!-- Header -->
  <div class="center" style="margin-bottom:28px">
    <div class="badge" style="margin-bottom:10px">MORNING BRIEFING</div>
    <h1 style="margin-bottom:6px">Your Daily Intelligence Podcast</h1>
    <p class="mono muted" id="dateDisplay" style="font-size:13px"></p>
  </div>

  <!-- SCREEN: Setup (first time only) -->
  <div id="setupScreen">
    <div class="setup-card">
      <label>ANTHROPIC API KEY</label>
      <input type="password" id="claudeKey" placeholder="sk-ant-..." autocomplete="off" autocorrect="off" spellcheck="false">
      <label style="margin-top:12px">OPENAI API KEY</label>
      <input type="password" id="openaiKey" placeholder="sk-proj-..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="save-btn" onclick="saveKeys()">Save Keys & Start</button>
      <p class="mono muted" style="font-size:11px;margin-top:10px;text-align:center">Keys saved to your device only — never in the code</p>
    </div>
  </div>

  <!-- SCREEN: Main player -->
  <div id="mainScreen" style="display:none">
    <div class="status-bar info" id="statusBar" style="display:none"></div>

    <!-- Loading spinner (while generating script) -->
    <div id="loadingScript" class="spinner-wrap" style="display:none">
      <div class="spinner"></div>
      <p class="mono" style="color:#f97316;font-size:13px" id="loadingMsg">Generating today's briefing...</p>
    </div>

    <!-- Segments -->
    <div class="seg-list" id="segList"></div>

    <!-- Progress bar -->
    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-times"><span id="timeElapsed">0:00</span><span>10:00</span></div>
    </div>

    <!-- Ready to play -->
    <div id="readyControls" class="center" style="display:none;margin-bottom:20px">
      <button class="btn-play" id="playBtn" onclick="startAudio()">▶</button>
      <p class="mono muted" id="playHint" style="font-size:13px;margin-top:12px">Tap to begin · ~10 minutes</p>
      <button class="btn-settings" onclick="showSettings()">⚙ Change API keys</button>
    </div>

    <!-- Playing -->
    <div class="controls" id="playingControls" style="display:none">
      <button class="btn-pause" id="pauseBtn" onclick="togglePause()">⏸</button>
      <button class="btn-stop" onclick="stopPlayback()">⏹</button>
    </div>

    <!-- Done -->
    <div id="doneControls" class="center" style="display:none">
      <p class="mono" style="color:#10b981;margin-bottom:18px;font-size:14px">✓ Briefing Complete</p>
      <button class="btn-spotify" onclick="openSpotify()">🎵 Open Spotify</button><br>
      <button class="btn-replay" onclick="replayBriefing()">↺ Play Again</button>
    </div>
  </div>

</div>
<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
const VOICE = "nova";
const SPEED = 1.05;
const TARGET_S = 10 * 60;

const SEGMENT_DEFS = [
  { key: "headlines", label: "Headlines & LA",  icon: "📰", color: "#f97316" },
  { key: "realestate",label: "Real Estate",     icon: "🏙️", color: "#3b82f6" },
  { key: "startups",  label: "Startups & Tech", icon: "🚀", color: "#10b981" },
  { key: "markets",   label: "Markets",         icon: "📊", color: "#8b5cf6" },
  { key: "sports",    label: "Sports",          icon: "🏀", color: "#f59e0b" },
];

const SYSTEM_PROMPT = `You are an energetic, sharp morning podcast host. Generate a punchy 10-minute briefing script for today.

Output ONLY a JSON object with exactly these keys: headlines, realestate, startups, markets, sports.
Each value is a string of spoken prose — no bullet points, no markdown, no asterisks.
Write conversationally with energy — contractions, transitions, rhetorical questions.
Keep each segment to 2-3 paragraphs max (about 150-200 words each) so the total is ~10 minutes spoken.

Briefing preferences:
- headlines: 1 major LA local story + 1-2 national political stories. No geopolitics unless a truly major event.
- realestate: LA market trends, notable deals, proptech startups, interest rate impacts.
- startups: 2-3 startups that just raised funding or are gaining serious traction. Be specific with names and amounts.
- markets: Today's index levels, biggest movers with specific catalysts, macro snapshot. Be specific with numbers.
- sports: 1 story — Lakers, Dodgers, Rams, Clippers, or whatever is most relevant today.

End the sports segment with a warm sign-off for the day.
Today's date: DATE_PLACEHOLDER`;

// ── STATE ─────────────────────────────────────────────────────────────────
let claudeApiKey = localStorage.getItem("claude_api_key") || "";
let openaiApiKey = localStorage.getItem("openai_api_key") || "";
let segments = {}; // { headlines: "text...", ... }
let audioBlobs = new Array(SEGMENT_DEFS.length).fill(null);
let audioEl = null;
let currentIdx = 0;
let isPaused = false;
let progressInterval = null;
let startTime = null;
let elapsedPaused = 0;

// ── INIT ──────────────────────────────────────────────────────────────────
window.onload = () => {
  const now = new Date();
  document.getElementById("dateDisplay").textContent = now.toLocaleDateString("en-US", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });

  if (claudeApiKey && openaiApiKey) {
    document.getElementById("setupScreen").style.display = "none";
    document.getElementById("mainScreen").style.display = "block";
    generateScript();
  }
};

// ── SETUP ─────────────────────────────────────────────────────────────────
function saveKeys() {
  const ck = document.getElementById("claudeKey").value.trim();
  const ok = document.getElementById("openaiKey").value.trim();
  if (!ck || !ok) { alert("Please enter both API keys."); return; }
  claudeApiKey = ck;
  openaiApiKey = ok;
  localStorage.setItem("claude_api_key", ck);
  localStorage.setItem("openai_api_key", ok);
  document.getElementById("setupScreen").style.display = "none";
  document.getElementById("mainScreen").style.display = "block";
  generateScript();
}

function showSettings() {
  document.getElementById("mainScreen").style.display = "none";
  document.getElementById("setupScreen").style.display = "block";
  document.getElementById("claudeKey").value = claudeApiKey;
  document.getElementById("openaiKey").value = openaiApiKey;
}

// ── GENERATE SCRIPT VIA CLAUDE ────────────────────────────────────────────
async function generateScript() {
  showLoading("Generating today's briefing with Claude...");
  renderSegments("pending");

  const today = new Date().toLocaleDateString("en-US", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });
  const prompt = SYSTEM_PROMPT.replace("DATE_PLACEHOLDER", today);

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "x-api-key": claudeApiKey,
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 4000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`Claude API error ${res.status}: ${err.slice(0,200)}`);
    }

    const data = await res.json();
    const raw = data.content.filter(b => b.type === "text").map(b => b.text).join("");

    // Parse JSON — strip any markdown fences
    const clean = raw.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);

    // Validate all keys present
    for (const def of SEGMENT_DEFS) {
      if (!parsed[def.key]) throw new Error(`Missing segment: ${def.key}`);
    }

    segments = parsed;
    hideLoading();
    renderSegments("pending");

    // Now generate all audio
    await generateAllAudio();

  } catch(e) {
    hideLoading();
    showError(`Script generation failed: ${e.message}. Tap retry.`, true);
    showRetryBtn();
  }
}

// ── GENERATE AUDIO VIA OPENAI TTS ─────────────────────────────────────────
async function generateAllAudio() {
  showStatus("Generating audio — about 15 seconds...", false);
  renderSegments("pending");

  try {
    await Promise.all(SEGMENT_DEFS.map((def, i) => fetchAudio(i, def.key)));
    hideStatus();
    document.getElementById("readyControls").style.display = "block";
    renderSegments("ready");
  } catch(e) {
    showError(`Audio generation failed: ${e.message}`, true);
    showRetryBtn();
  }
}

async function fetchAudio(idx, key) {
  setSegSub(idx, "generating...", false);
  const res = await fetch("https://api.openai.com/v1/audio/speech", {
    method: "POST",
    headers: { "Authorization": `Bearer ${openaiApiKey}`, "Content-Type": "application/json" },
    body: JSON.stringify({ model: "tts-1", input: segments[key], voice: VOICE, speed: SPEED })
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`OpenAI TTS error ${res.status}: ${err.slice(0,150)}`);
  }
  const blob = await res.blob();
  audioBlobs[idx] = URL.createObjectURL(blob);
  setSegSub(idx, "✓ ready", true);
}

// ── PLAYBACK ──────────────────────────────────────────────────────────────
function startAudio() {
  currentIdx = 0; elapsedPaused = 0; isPaused = false;
  document.getElementById("playBtn").disabled = true;
  document.getElementById("readyControls").style.display = "none";
  document.getElementById("playingControls").style.display = "flex";
  document.getElementById("progressWrap").style.display = "block";
  startTime = Date.now();
  startProgressTimer();
  playSegment(0);
}

function playSegment(idx) {
  if (idx >= SEGMENT_DEFS.length) {
    clearInterval(progressInterval);
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("timeElapsed").textContent = "10:00";
    document.getElementById("playingControls").style.display = "none";
    document.getElementById("progressWrap").style.display = "none";
    document.getElementById("doneControls").style.display = "block";
    setAllDone();
    return;
  }
  currentIdx = idx;
  if (idx > 0) setSegState(idx - 1, "done");
  setSegState(idx, "active");
  audioEl = new Audio(audioBlobs[idx]);
  audioEl.onended = () => playSegment(idx + 1);
  audioEl.onerror = () => playSegment(idx + 1);
  audioEl.play().catch(() => playSegment(idx + 1));
}

function togglePause() {
  if (!audioEl) return;
  if (isPaused) {
    audioEl.play(); isPaused = false;
    document.getElementById("pauseBtn").textContent = "⏸";
    startProgressTimer();
  } else {
    audioEl.pause(); isPaused = true;
    elapsedPaused += (Date.now() - startTime) / 1000;
    clearInterval(progressInterval);
    document.getElementById("pauseBtn").textContent = "▶";
  }
}

function stopPlayback() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  clearInterval(progressInterval);
  isPaused = false; elapsedPaused = 0;
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("timeElapsed").textContent = "0:00";
  document.getElementById("playingControls").style.display = "none";
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("doneControls").style.display = "none";
  document.getElementById("readyControls").style.display = "block";
  document.getElementById("playBtn").disabled = false;
  renderSegments("ready");
}

function replayBriefing() {
  document.getElementById("doneControls").style.display = "none";
  document.getElementById("progressWrap").style.display = "block";
  document.getElementById("playingControls").style.display = "flex";
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("timeElapsed").textContent = "0:00";
  currentIdx = 0; elapsedPaused = 0; isPaused = false;
  startTime = Date.now();
  startProgressTimer();
  playSegment(0);
}

function startProgressTimer() {
  clearInterval(progressInterval);
  startTime = Date.now();
  progressInterval = setInterval(() => {
    const total = elapsedPaused + (Date.now() - startTime) / 1000;
    const pct = Math.min(total / TARGET_S * 100, 99);
    document.getElementById("progressFill").style.width = pct + "%";
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    document.getElementById("timeElapsed").textContent = `${m}:${String(s).padStart(2,"0")}`;
  }, 1000);
}

// ── SEGMENT UI ────────────────────────────────────────────────────────────
function renderSegments(mode) {
  const list = document.getElementById("segList");
  list.innerHTML = SEGMENT_DEFS.map((s, i) => `
    <div class="seg-btn" id="seg_${i}" style="--seg-color:${s.color}">
      <span class="seg-icon">${s.icon}</span>
      <div style="flex:1">
        <div class="seg-label" id="seglabel_${i}">${s.label}</div>
        <div id="segwave_${i}" style="display:none">
          <div class="wave">${[0,1,2,3,4].map(j=>`<div class="wave-bar" style="background:${s.color};animation-delay:${j*.1}s"></div>`).join("")}</div>
        </div>
        <div class="seg-sub" id="segsub_${i}">${mode === "ready" ? "✓ ready" : "pending..."}</div>
      </div>
      <span id="segcheck_${i}" style="display:none;color:#10b981;font-size:18px">✓</span>
      <span id="segplaying_${i}" style="display:none;color:${s.color};font-size:11px;font-family:monospace">PLAYING</span>
    </div>
  `).join("");
}

function setSegSub(idx, text, isReady) {
  const el = document.getElementById(`segsub_${idx}`);
  if (el) { el.textContent = text; el.className = "seg-sub" + (isReady ? " ready" : ""); }
}

function setSegState(idx, state) {
  const btn   = document.getElementById(`seg_${idx}`);
  const label = document.getElementById(`seglabel_${idx}`);
  const wave  = document.getElementById(`segwave_${idx}`);
  const check = document.getElementById(`segcheck_${idx}`);
  const play  = document.getElementById(`segplaying_${idx}`);
  const sub   = document.getElementById(`segsub_${idx}`);
  if (!btn) return;
  btn.classList.toggle("active", state === "active");
  label.className = "seg-label" + (state === "active" ? " active" : state === "done" ? " done" : "");
  wave.style.display  = state === "active" ? "block" : "none";
  check.style.display = state === "done"   ? "inline" : "none";
  play.style.display  = state === "active" ? "inline" : "none";
  if (sub) sub.style.display = (state === "active" || state === "done") ? "none" : "block";
}

function setAllDone() {
  SEGMENT_DEFS.forEach((_, i) => setSegState(i, "done"));
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById("loadingScript").style.display = "block";
  document.getElementById("loadingMsg").textContent = msg;
  document.getElementById("readyControls").style.display = "none";
}
function hideLoading() { document.getElementById("loadingScript").style.display = "none"; }

function showStatus(msg, isError) {
  const el = document.getElementById("statusBar");
  el.textContent = msg;
  el.className = "status-bar " + (isError ? "error" : "info");
  el.style.display = "block";
}
function hideStatus() { document.getElementById("statusBar").style.display = "none"; }
function showError(msg) { showStatus(msg, true); }

function showRetryBtn() {
  const el = document.getElementById("statusBar");
  el.innerHTML += ' <button onclick="generateScript()" style="margin-left:8px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);color:#ef4444;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px">Retry</button>';
}

function openSpotify() { window.location.href = "https://open.spotify.com"; }
</script>
</body>
</html>
